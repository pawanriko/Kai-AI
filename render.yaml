# Render Blueprint for KAI (moved off Antideploy 2026-11-10 — its
# container-to-Google egress stalled chat calls into 502s; Render's
# network runs HireSense fine, so KAI moves here too).
# Dashboard: New -> Blueprint -> select this repo. Render reads this
# file, creates the service, and deploys from main on every push.
#   * Build order matters: the React app is built BEFORE collectstatic,
#     so the built files exist for Django to collect and WhiteNoise to
#     serve at the site root. Migrations run in the build against the
#     DATABASE_URL set in the dashboard.
#   * DATABASE_URL: a Neon Postgres connection string (DIRECT, not
#     the pooler) — set in the dashboard, never committed. Render's
#     own free Postgres expires after ~30 days, so KAI uses Neon like
#     HireSense does.
#   * GEMINI_API_KEY + OPENROUTER_API_KEY: set in the dashboard only.
#     No AI_PROVIDER pin (removed 2026-11-10): chat uses the picked
#     model first, then falls back across configured providers — so
#     a Gemini 503 lands on OpenRouter's free models instead of
#     failing. OpenRouter was added the night gemini-3.8-flash spent
#     the evening answering 503 (Google-side overload).
#   * SECRET_KEY is generated by Render (never the dev fallback).
services:
  - type: web
    name: kai-ai
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt -r requirements-prod.txt && npm --prefix frontend ci && npm --prefix frontend run build && python manage.py collectstatic --noinput && python manage.py migrate"
    # Phase 2.4 (F6): 2 workers instead of the gunicorn default of 1,
    # so one slow provider call cannot stall every other request.
    # Kept at 2: the free tier has limited RAM, and the rate-limit
    # counters are per-process locmem (see SECURITY_AUDIT S4), so
    # each worker enforces its own window — acceptable for a
    # single-owner instance; revisit if a shared cache is added.
    # Deploy-time verification deferred (no deploy in this chain).
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 2"
    envVars:
      - key: DEBUG
        value: "False"
      # Phase 1: turns on the strict production settings in
      # config/settings.py (SECRET_KEY required, secure cookies,
      # HSTS, ALLOWED_HOSTS from APP_URL). Coding execution stays
      # OFF: KAI_CODING_ENABLED is deliberately never set here.
      - key: KAI_PRODUCTION
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Bootstrap secret for first-owner setup: the /api/auth/setup/
      # endpoint demands this token, so a random visitor can never
      # claim a fresh deployment. Set a long random value here BEFORE
      # the first deploy, use it once on the setup screen, then it
      # may be removed (setup closes permanently once a user exists).
      - key: KAI_SETUP_TOKEN
        sync: false
      - key: APP_URL
        value: "https://kai-ai-02i0.onrender.com"
      - key: PYTHON_VERSION
        value: 3.12.0
